name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build wheel
        run: pip wheel --no-deps . --wheel-dir /tmp/ai-toolkit-wheel

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q
