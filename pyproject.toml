[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-toolkit"
dynamic = ["version"]
description = "Reusable API wrappers for ARK (豆包), Gemini, and other AI model providers."
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11.0.0",
  "pydantic>=2.0,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
aliyun = [
  "alibabacloud-aidge20260428>=3.1.0,<4",
  "aliyun-python-sdk-core",
  "aliyun-python-sdk-imageseg",
  "aliyun-python-sdk-viapiutils",
  "oss2",
  "viapi-utils",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "ai_toolkit._version.VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_toolkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
